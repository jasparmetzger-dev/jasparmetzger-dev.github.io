<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jaspar Metzger</title>
  <meta name="description" content="Jaspar Metzger — mathematics student in Bonn, research assistant at Fraunhofer ITWM. Projects, experience and CV.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ctext x='32' y='42' font-family='system-ui,sans-serif' font-size='28' font-weight='600' fill='white' text-anchor='middle'%3EJM%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply saved theme before paint to avoid a flash.
    (function () {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Skip to content</a>

  <header class="nav" id="nav">
    <div class="nav__inner">
      <a class="nav__brand" href="#top" id="brand"></a>
      <nav aria-label="Sections">
        <ul class="nav__links" id="nav-links"></ul>
      </nav>
      <div class="seg" role="group" aria-label="Language" data-i18n-label="lang">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="de" aria-pressed="false">DE</button>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" data-i18n-label="theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section class="hero" id="top">
      <div class="wrap">
        <p class="eyebrow" id="hero-role"></p>
        <h1 class="hero__title" id="hero-name"></h1>
        <p class="hero__headline" id="hero-headline"></p>
        <p class="hero__intro" id="hero-intro"></p>
        <div class="hero__actions" id="hero-actions"></div>
      </div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="wrap">
        <header class="section__head">
          <h2 id="projects-title" data-i18n="projects">Projects</h2>
          <p class="section__sub" data-i18n="projectsSub">Things I've built. Most of the code is on GitHub.</p>
        </header>
        <div class="projects" id="project-grid"></div>
        <div class="repos" id="repos" hidden>
          <div class="repos__head">
            <h3 class="repos__title" data-i18n="moreRepos">More on GitHub</h3>
            <a class="repos__all" id="repos-all" target="_blank" rel="noopener"></a>
          </div>
          <ul class="card repo-list" id="repo-list"></ul>
        </div>
      </div>
    </section>

    <div id="timeline-sections"></div>

    <section class="section" id="skills" aria-labelledby="skills-title">
      <div class="wrap">
        <header class="section__head">
          <h2 id="skills-title" data-i18n="skills">Skills</h2>
        </header>
        <div class="skills" id="skills-grid"></div>
      </div>
    </section>
  </main>

  <footer class="footer" id="contact">
    <div class="wrap">
      <h2 class="footer__title" data-i18n="contactTitle">Get in touch.</h2>
      <div class="footer__links" id="footer-links"></div>
      <p class="footer__meta" id="footer-meta"></p>
    </div>
  </footer>

  <noscript><p class="wrap">This site needs JavaScript to render its content.</p></noscript>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
